# ============================================================================
# haven-console — nginx 同域入口配置（任务 2.10）
#
# 形态 = tech-design「多方会话拓扑」的同域入口：/console/*（本控制台静态）、
# /cam/*（e-cam-web）、/api/iam/* → eiam :9000 /api/*，浏览器单一登录域共享
# session cookie（SSO / 双向单点登出的部署承载，Integration Specs #1~#3）。
#
# 使用方式：
#   - 生产/验收：本文件并入 nginx 主配置 http 上下文（如 conf/vhost/ 目录 include），
#     listen/server_name 按宿主调整。与现役 :8888 dev vhost 并存验证时临时改 listen 口
#     （两 server 同名同口时后者被忽略并告警，避免误并入双注册）。
#   - 并入现役 dev vhost 时：删除本文件 location /（沿用 vhost 既有的 ecmdb-web /
#     e-cam-service /api 路由），其余 location 就位即生效。
#
# 验收宿主硬规则：必为 nginx 同域形态（沿用 :8888/cam 前例）；禁止以 vite dev
# server 判定通过（tech-design §Testing：dev 直连缺 /api/iam 代理 + 无共享 cookie）。
#
# ── 回切三件套（Integration Specs #5；全部无 rebuild 可执行；执行人：平台管理员
#    + eiam owner 双人复核；上线前 staging 完整演练一次并计时，PRD 承诺 10 分钟内）──
#  ① /console 静态池注释行切换 + `nginx -s reload`（秒级）→ location ^~ /console/
#  ② e-cam-web 401 目标新旧双产物（RC#2 / 任务 2.13）→ location ^~ /cam/
#  ③ 过渡期旧登录入口 301 → /console/login → location = /login
#
# ── Cookie / CSRF（1.2 认证链路矩阵 + parity-checklist F-4）──
#  - nginx 原样透传 Cookie 与 Set-Cookie（无 proxy_hide_header、无属性改写）；
#    cookie 域/属性唯一权威 = eiam（1.2 矩阵会签后生效，nginx 不做二次定义）
#  - F-4（Phase 0 实核）：eiam session cookie 当前无 SameSite 属性（ginx
#    cookie/carrier.go:24-31 结构体无 SameSite 字段，gin SetCookie sameSite=0 →
#    属性省略；eiam 全仓无 SetSameSite 调用）→ tech-design Security「SameSite
#    承载 CSRF」前提现由浏览器 Lax-by-default 兜底，非 eiam 显式声明。处置 =
#    eiam owner 会签接受，或 eiam 补 SetSameSite（parity-checklist F-4 挂账）。
#    nginx 层不代改写（域/属性权威在 eiam），CSRF 重评估随会签结论收敛。
#  - connect-src 'self'（CSP）+ /api/iam/ 零 CORS 头：禁止控制台跨域直连 eiam，
#    API 仅同源 /api/iam 可达（PRD Security Requirements 同条款）。
#
# ── CSP 基线（tech-design §Security 表；起草 = 平台管理员，复核 = eiam owner，
#    随认证链路兼容矩阵双签）──
#  style-src 'unsafe-inline' 为 Element Plus 弹层运行时内联定位样式所需；
#  任务 5.6 按真实构建产物实测，可去除则收紧并记录。本文件先落基线值。
# ============================================================================

# eiam upstream：本机形态 127.0.0.1:9000；容器/生产形态改 `server eiam:9000;`
upstream eiam {
    server 127.0.0.1:9000;
    keepalive 16;
}

# /console 缓存策略：content-hash 产物长缓存 immutable；index.html 与 SPA 路由
# 回退每次协商 revalidate（tech-design 性能预算：二次访问 ≤1s 命中 immutable，
# index.html no-cache）
map $uri $console_cache_control {
    ~*\.(js|mjs|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$  "public, max-age=31536000, immutable";
    default                                                       "no-cache";
}

server {
    listen      8888;        # 同域入口（沿用 :8888 前例）；端口冲突并存验证时临时改口
    server_name localhost;

    # 悬空根兜底：独立运行时未知路径一律 404（并入现役 vhost 时删除本块，
    # 由 vhost 既有 location / 承接 ecmdb-web 与 e-cam-service /api 路由）
    location / {
        return 404;
    }

    # ── /api/iam/* → eiam :9000 /api/*（同域 API 通道；写/读/销毁 JWT session）──
    location ^~ /api/iam/ {
        proxy_pass http://eiam/api/;
        # 登录/切租户响应携带大体积 Set-Cookie（JWT 内含授权声明 4KB+），默认
        # proxy_buffer_size 装不下会 502 "upstream sent too big header"（:8888 前例）
        proxy_buffer_size 32k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;
        # keepalive 复用 upstream 连接（与 upstream eiam keepalive 16 配对）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;                      # 原样透传（F-4 见文件头）
        proxy_set_header X-Active-Tenant-ID $http_x_active_tenant_id;
        # 刻意不加任何 Access-Control-Allow-* 头：同域形态无跨域调用（connect-src 'self'）
    }

    # ── /console 裸路径规范化（无尾斜杠 301 进静态 location）──
    location = /console {
        return 301 /console/;
    }

    # ── /console/* 控制台静态托管（vite base=/console/ 构建产 dist）──
    # 回切开关 ①：注释行切换静态池 + `nginx -s reload`（秒级，无 rebuild）。
    # 常规发版改「发布目录软链/junction」重指即可（免 reload）；nginx 注释行切换
    # 是软链失效/异常时的回切兜底，两形态均不触碰产物本身。
    location ^~ /console/ {
        # 回切池切换行（回切时：注释「现役池」行、启用「回切池」行，reload 生效）
        alias D:/Haven/haven-console/dist/;               # 现役池：当前发布产物（current）
        # alias D:/Haven/haven-console/dist-previous/;    # 回切池：上一版发布产物（previous）
        index index.html;
        try_files $uri $uri/ /console/index.html;
        # 构建期预生成 .gz（任务 2.11 构建脚本衔接）+ gzip_static：预压缩产物直出，
        # 无 .gz 时自动回退原文件（不阻塞上线）
        gzip_static on;
        add_header Vary "Accept-Encoding" always;
        # CSP 基线（覆盖全部 /console 路由；指令值依据见文件头「CSP 基线」）
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Frame-Options "DENY" always;          # frame-ancestors 'none' 的传统等价
        # HSTS：HTTPS 终止处生效（HTTP :8888 下浏览器忽略该头，留置无害）
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control $console_cache_control always;
    }

    # ── /cam/* e-cam-web 静态（回切开关 ②：401 目标新旧双产物并存）──
    # 双产物语义（RC#2 / 任务 2.13，build 期 env 注入、不散落硬编码）：
    #   dist-new：VITE_LOGIN_TARGET=/console/login → 401/登出跳控制台登录页（新形态）
    #   dist-old：VITE_LOGIN_TARGET 空            → 401 跳 ecmdb-web /login（旧形态）
    # 切换 = 注释行切换 + `nginx -s reload`；部署期等价做法 = cam-current 软链重指
    # （秒级、免 reload）。应用切换器新标签直开 /cam/，共享同一 session cookie（Integration #2）。
    location ^~ /cam/ {
        # 回切池切换行（同 ① 机制）
        alias D:/Haven/e-cam-web/dist/;                    # 现役池：cam-current（401 → /console/login）
        # alias D:/Haven/e-cam-web/dist-old/;              # 回切池：cam-previous（401 → /login）
        index index.html;
        try_files $uri $uri/ /cam/index.html;
        # 开发变体（启用时注释掉上方 alias/index/try_files 三行）：反代 e-cam-web
        # vite dev server，HMR websocket 随 Upgrade 透传 —— 与现役 :8888 dev vhost 同款
        # proxy_pass http://127.0.0.1:5173/cam/;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
        # proxy_set_header Host $host;
    }

    # ── 过渡期旧登录入口 301（回切开关 ③）──
    # ecmdb-web 在线期间旧登录入口收敛至控制台 /console/login（ecmdb-web 仓库零改动；
    # 权威登录入口 = 控制台，Integration #3）。ecmdb-web 下线时删除本 location
    # 即「下线就绪」部署项（tech-design §过渡期 ecmdb-web 登录重定向）。
    # $is_args$args 保留 ?redirect= 回跳参数（旧登录链接带 query 不丢）。
    location = /login {
        return 301 /console/login$is_args$args;
    }
}
